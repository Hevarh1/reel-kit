<html><head><meta charset="utf-8">

<style>
html,body{margin:0;background:transparent;width:1080px;height:1920px;overflow:hidden}
.layer{position:absolute;left:0;top:0;width:1080px;height:1920px;overflow:hidden}
.abs{position:absolute}
.ku{font-family:var(--font);direction:var(--dir)}
.mask{display:inline-block;overflow:hidden;vertical-align:bottom;padding:.12em .08em .2em;margin:-.12em -.08em -.2em}
.mask>span{display:inline-block;will-change:transform}
.cap{position:absolute;left:100px;width:840px;text-align:center;direction:var(--dir);font-family:var(--font);font-weight:800;font-size:80px;line-height:1.3;color:#fff;transform:translateY(-50%);
  text-shadow:0 0 26px rgba(0,0,0,.6),0 3px 8px rgba(0,0,0,.55)}
.cap span{display:inline-block;margin:0 9px;white-space:nowrap;unicode-bidi:isolate}
.cap.hero{font-size:104px;font-weight:900}
.cap.onlight{color:#2B2C30;text-shadow:none}
.cap.onpanel:not(.onlight){text-shadow:none}
svg.ln *{fill:none;stroke-linecap:round;stroke-linejoin:round}
</style></head>
<body>
<div id="front" class="layer"></div>
<script src="work/words.js"></script>
<script src="config.js"></script>
<script src="lib.js"></script>
<script src="timeline.js"></script>
<script src="finish.js"></script>
</body></html>
